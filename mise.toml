[tools]
dotnet = "10"
# Pinned, because a hook that changes under you is a hook you stop trusting.
pre-commit = "4.6.2"

# Arguments after the task name are passed to its command: mise run cli play <id> --fullscreen

[tasks.fetch-ruffle]
description = "Fetch the pinned Ruffle (eng/ruffle.json) the app plays contrées with, for this machine or a runtime identifier"
run = "dotnet run eng/fetch-ruffle.cs"

[tasks.fetch-flash-player]
description = "Fetch the pinned Flash projector (eng/flash-player.json) contrées play in, with its libraries on Linux, for this machine or a runtime identifier"
run = "dotnet run eng/fetch-flash-player.cs"

[tasks.build]
description = "Build the app, with the pinned Flash projector and Ruffle it plays in"
depends = ["fetch-flash-player", "fetch-ruffle"]
run = "dotnet build EternalfestDesktop.slnx"

[tasks.test]
description = "Run the automated tests"
# After the format check when both run (mise run ci): in parallel, they restore and build the
# same projects at once, which Windows' file locks break.
wait_for = ["check"]
run = "dotnet test EternalfestDesktop.slnx"

[tasks.mutation]
description = "Measure how many mutants the tests kill, with Stryker.NET, in Infrastructure unless told otherwise: mise run mutation [--project EternalfestDesktop.Domain.csproj] [-m '**/StageSize.cs'], report in artifacts/stryker"
dir = "tests/EternalfestDesktop.Tests"
run = "dotnet tool restore && dotnet stryker --output ../../artifacts/stryker"

[tasks.format]
description = "Format the code with the .editorconfig rules"
run = "dotnet format EternalfestDesktop.slnx"

[tasks.check]
description = "Fail when the code isn't formatted"
run = "dotnet format EternalfestDesktop.slnx --verify-no-changes"

[tasks.ci]
description = "Everything that must pass before a change leaves the machine: what the pre-push hook and the CI run"
depends = ["check", "test"]

[tasks.coverage]
description = "Measure the line coverage of the tests, as Cobertura in TestResults/coverage.cobertura.xml"
run = "dotnet test EternalfestDesktop.slnx --coverage --coverage-settings coverage.config --coverage-output-format cobertura --coverage-output coverage.cobertura.xml"

[tasks.hooks]
description = "Install the git hooks, once per clone"
run = "pre-commit install --install-hooks"

[tasks.app]
description = "Run the app"
depends = ["fetch-flash-player", "fetch-ruffle"]
run = "dotnet run --project src/EternalfestDesktop.Ui"

[tasks.cli]
description = "Run the developer console: catalog, game, download, downloaded, play"
depends = ["fetch-flash-player", "fetch-ruffle"]
run = "dotnet run --project src/EternalfestDesktop.Cli --"

[tasks.package]
description = "Build what a release of version.txt publishes for a runtime, in artifacts/packages: the Velopack installer and portable zip, or AppImage and tar.gz, with their update feed (needs mksquashfs for Linux): mise run package [linux-x64|win-x64]"
run = "eng/package.sh"

[tasks.port-quests]
description = "Port the quests eternalfest.net hardcodes (ADR 0007): mise run port-quests <path to quest_db.rs>"
run = "dotnet run eng/port-quests.cs"

[tasks.icons]
description = "Make the app icon (icon.png, icon.ico) from assets/icon/eternalfest-logo.png"
run = "dotnet run eng/make-icons.cs"
