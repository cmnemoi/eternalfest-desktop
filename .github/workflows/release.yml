name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # @spec packaging::released-from-tag
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - run: mise run test --configuration Release

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mise run package linux-x64 "$version"
          mise run package win-x64 "$version"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/packages/* --title "$GITHUB_REF_NAME" --generate-notes
