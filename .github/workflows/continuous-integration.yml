# Everything that must pass before a change is merged.
#
# Windows and Linux both, because both are shipped: paths, the Ruffle process
# and the data folders differ between them.
name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:
    # The release pull request only bumps these: the code it releases already passed on main, and
    # merging it runs this workflow on main again before anything is published.
    paths-ignore:
      - CHANGELOG.md
      - version.txt
      - .release-please-manifest.json
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest runs on Apple Silicon, like the Macs the app ships for
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      # mise-action caches the tools it installs; this caches the NuGet packages the build restores.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      # The same name the pre-push hook calls, so the two cannot drift apart.
      - run: mise run ci
      # Measured once: the code is the same on both systems.
      - if: matrix.os == 'ubuntu-latest'
        run: mise run coverage
      - if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: TestResults/coverage.cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # What the delivery publishes, built on every change rather than first on release day.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Velopack packs Windows from Linux, but only macOS can sign and pack the Mac app.
          - os: ubuntu-latest
            runtimes: linux-x64 win-x64
          - os: macos-latest
            runtimes: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: artifacts/ruffle
          key: ruffle-${{ runner.os }}-${{ hashFiles('eng/ruffle.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: artifacts/flash-player
          key: flash-player-${{ runner.os }}-${{ hashFiles('eng/flash-player.json') }}
      # Velopack makes the AppImage's file system with mksquashfs.
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install --yes --no-install-recommends squashfs-tools
      # @spec packaging::self-contained-archives
      # @spec packaging::update-feed
      - run: for runtime in ${{ matrix.runtimes }}; do mise run package "$runtime"; done
